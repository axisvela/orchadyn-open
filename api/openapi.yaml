openapi: 3.1.0
info:
  title: ORCHADYN Planning API
  version: 0.1.0
  description: Public contract for compiling and verifying capability plans.
paths:
  /plans:
    get:
      summary: List plan summaries available to the authenticated tenant
      responses:
        '200':
          description: Tenant-scoped plan IDs and digests
  /healthz:
    get:
      summary: Check service health
      responses:
        '200':
          description: API and plan ledger are ready
        '503':
          description: Plan ledger is unavailable or not configured
  /plans:generate:
    post:
      summary: Generate plan candidates from a goal and context references
      responses:
        '200':
          description: Candidate plan, deterministic verification results, and PRAXOVELA projection
  /governed-plans:generate:
    post:
      summary: Generate a plan from MODUREGIS capability and AEGIVELA authority providers
      responses:
        '200':
          description: Evidence-backed governed plan package
        '422':
          description: Deterministic governance violations prevented plan verification
        '503':
          description: Governed planning control plane is not configured
  /plans:verify:
    post:
      summary: Verify a plan against immutable planning inputs
      responses:
        '200':
          description: Evidence bundle for a valid plan
        '422':
          description: Evidence bundle listing deterministic violations
  /plans:revise:
    post:
      summary: Create an evidence-backed revision without changing completed effects
      responses:
        '200':
          description: Persisted revised plan package and auditable plan diff
        '422':
          description: Revision is invalid or changes a completed effect
  /plans/{planId}:
    get:
      summary: Retrieve a persisted verified plan package
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evidence-backed plan package
        '404':
          description: Plan package was not found
  /plans/{planId}:project:
    post:
      summary: Project a persisted plan to a supported execution runtime
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runtime projection and semantic-loss report
        '404':
          description: Plan package was not found
        '422':
          description: Projection target is unsupported
  /plans/{planId}/explain:
    get:
      summary: Retrieve recorded candidate, validation, and revision evidence for a plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evidence-backed explanation without generated rationale
        '404':
          description: Plan package was not found
  /plans/{planId}/events:
    get:
      summary: List tenant-scoped verification and revision events for a plan
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Immutable plan audit events
  /plans/{planId}:impact:
    post:
      summary: Identify the plan subgraph affected by changed nodes
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Changed, affected, and unknown plan node IDs
        '404':
          description: Plan package was not found
